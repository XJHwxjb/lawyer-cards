<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>10-照片</title>
<style>
:root{
  --ink-7:#1B1834;
  --gold-10:#C99A5C;
  --gold-14:#D0B27B;
  --gold-18:#D8BE8C;
  --gold-21:#E5C68B;
  --gold-25:#F0CE97;
  --cream-4:#FFF2CE;
  --neutral-5:#FFFFFF;
}

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1440px;overflow:hidden;background:var(--ink-7);}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .card{position:relative;width:1080px;height:1440px;background:var(--ink-7);overflow:hidden;}

  /* 底光：有照片时是一层暖调，没照片时撑住整个版面，不至于变成一块空黑板 */
  .glow{position:absolute;inset:0;
    background:
      radial-gradient(720px 540px at 6% -8%,rgba(216,190,140,.17),rgba(216,190,140,0) 64%),
      radial-gradient(660px 500px at 104% 104%,rgba(52,86,134,.30),rgba(52,86,134,0) 62%);}

  /* 全幅照片：没有照片时自动退化为纯深色金句卡 */
  .ph{position:absolute;left:0;top:0;width:1080px;height:1440px;object-fit:cover;}

  .shade{position:absolute;inset:0;
    background:
      linear-gradient(to bottom,rgba(8,14,26,.54) 0%,rgba(8,14,26,.12) 26%,rgba(8,14,26,0) 44%),
      linear-gradient(to top,rgba(8,14,26,.97) 0%,rgba(8,14,26,.93) 17%,rgba(8,14,26,.66) 42%,rgba(8,14,26,.04) 72%);}

  .wm{position:absolute;right:70px;top:66px;font-size:24px;font-weight:900;
      letter-spacing:.02em;transform:skewX(-8deg);
      background-image:linear-gradient(180deg,var(--cream-4) 0%,var(--gold-25) 40%,var(--gold-10) 100%);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;color:transparent;
      filter:drop-shadow(0 2px 10px rgba(0,0,0,.55));}
  .kick{position:absolute;left:74px;top:74px;display:flex;align-items:center;font-size:19px;
        color:rgba(255,255,255,.7);letter-spacing:.22em;}
  .kick i{display:block;width:28px;height:1px;background:var(--gold-14);margin-right:14px;}
  .kick b{font-weight:400;font-size:17px;color:var(--gold-18);letter-spacing:.12em;margin-left:16px;}

  .quote{position:absolute;left:74px;bottom:214px;width:940px;}
  /* 文字压脚：照片里有亮面时保证标题始终看得清 */
  .quote:before{content:'';position:absolute;left:-74px;right:-74px;top:-70px;bottom:-214px;
    background:linear-gradient(to top,rgba(6,8,18,.94) 0%,rgba(6,8,18,.90) 46%,
               rgba(6,8,18,.55) 74%,rgba(6,8,18,0) 100%);pointer-events:none;}
  .quote > *{position:relative;}
  .quote .bar{width:64px;height:3px;background:var(--gold-18);margin-bottom:36px;}
  h1{font-size:84px;line-height:1.3;font-weight:800;color:var(--neutral-5);letter-spacing:.012em;
     text-shadow:0 2px 24px rgba(0,0,0,.45);}
  h1 .g{color:var(--gold-21);}
  .src{margin-top:34px;font-size:29px;line-height:1.54;color:rgba(255,255,255,.74);letter-spacing:.03em;}

  .sig{position:absolute;left:0;bottom:0;width:1080px;height:150px;
       border-top:1px solid rgba(255,255,255,.16);
       display:flex;align-items:center;padding:0 74px;}
  .sig .av{width:66px;height:66px;border-radius:50%;object-fit:cover;
           border:1px solid rgba(216,190,140,.6);}
  .sig .who{margin-left:22px;}
  .sig .nm{font-size:30px;font-weight:600;color:var(--neutral-5);letter-spacing:.04em;}
  .sig .og{margin-top:6px;font-size:22px;color:rgba(255,255,255,.55);letter-spacing:.08em;}
  .sig .qr{width:112px;height:112px;margin-left:auto;padding:9px;background:var(--neutral-5);
       border-radius:9px;flex:none;box-sizing:content-box;}
</style>
</head>
<body>
<div class="card">

  <div class="glow"></div>
  <!--PHOTO-->
  <img class="ph" src="{{PHOTO}}" alt="">
  <!--/PHOTO-->
  <div class="shade"></div>

  <div class="kick"><i></i>{{KICKER}}<b>{{ISSUE}}</b></div>
  <!--BRAND-->
  <div class="wm">{{BRAND}}</div>
  <!--/BRAND-->

  <div class="quote">
    <div class="bar"></div>
    <h1>{{TITLE}}</h1>
    <div class="src">{{NOTE}}</div>
  </div>

  <div class="sig">
    <img class="av" src="../assets/avatar.png" alt="">
    <div class="who">
      <div class="nm">{{NAME}}</div>
      <div class="og">{{ORG}}</div>
    </div>
    <img class="qr" src="../assets/qr.png" alt="">
  </div>

</div>
</body>
</html>
