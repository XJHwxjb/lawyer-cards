<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>11-品牌</title>
<style>
:root{
  --ink-1:#0C0918;
  --ink-2:#100C24;
  --ink-6:#1A1436;
  --ink-5:#1A1731;
  --ink-7:#1B1834;
  --ink-8:#1D1836;
  --ink-9:#221C3E;
  --ink-12:#241D4E;
  --ink-10:#241E44;
  --ink-11:#241F44;
  --gray-1:#57506C;
  --neutral-3:#8A8496;
  --gold-3:#A8802F;
  --gray-5:#A9A2B4;
  --gold-4:#B57F38;
  --gold-12:#D2A05C;
  --gold-18:#D8BE8C;
  --gold-17:#E2BA7E;
  --gold-19:#E6C085;
  --cream-1:#EFE2C8;
  --gold-30:#F2E1BE;
  --gold-26:#F4DAA6;
  --cream-3:#F8EBD4;
  --cream-9:#FBF1DF;
  --cream-14:#FEF9F0;
  --cream-7:#FFF6DA;
  --cream-15:#FFFBEF;
  --neutral-5:#FFFFFF;
}
  /* SVG 呈现属性不能用 var()，用属性选择器覆盖 */
[stroke="#D8BE8C"],[fill="#D8BE8C"]{stroke:var(--gold-18);fill:var(--gold-18)}

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1440px;overflow:hidden;background:var(--ink-7);}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .card{position:relative;width:1080px;height:1440px;overflow:hidden;
        background:linear-gradient(158deg,var(--ink-11) 0%,var(--ink-5) 44%,var(--ink-9) 72%,var(--ink-8) 100%);}

  /* ── 底纹：放射光线（PDF 里最有辨识度的一层） ── */
  .rays{position:absolute;left:0;top:0;width:1080px;height:1440px;}
  .rays .dim{opacity:.155;}
  .rays .dim2{opacity:.085;}
  .halo{position:absolute;left:-120px;top:-260px;width:1320px;height:900px;
        background:radial-gradient(560px 380px at 50% 42%,rgba(216,190,140,.13),rgba(216,190,140,0) 66%);}
  .ring{position:absolute;border-radius:50%;border:1px solid rgba(216,190,140,.10);}
  .ring.a{width:1180px;height:1180px;left:-50px;top:120px;}
  .ring.b{width:880px;height:880px;left:100px;top:270px;border-color:rgba(216,190,140,.07);}

  /* ── 品牌标识：居中大字 + 小字 + 菱形 ── */
  .env{position:absolute;left:0;top:0;width:1080px;height:218px;
       background:linear-gradient(180deg,var(--ink-12) 0%,var(--ink-6) 40%,var(--ink-2) 100%);
       clip-path:polygon(0 0,1080px 0,1080px 218px,540px 145px,0 218px);}
  .envline{position:absolute;left:0;top:0;width:1080px;height:218px;pointer-events:none;}
  .panel:after{content:'';position:absolute;left:0;right:0;top:-64px;height:65px;
       background:linear-gradient(180deg,rgba(20,14,38,.30) 0%,rgba(20,14,38,.13) 32%,rgba(20,14,38,0) 74%),var(--cream-14);
       clip-path:polygon(0 64px,476px 0,952px 64px,952px 100%,0 100%);}
  .brand{position:absolute;left:0;top:18px;width:1080px;text-align:center;}
  .brand .wm{position:relative;display:inline-block;font-weight:900;font-size:70px;line-height:1;
        letter-spacing:.035em;transform:skewX(-11deg) scaleY(1.03);padding:0 16px 12px;}
  .brand .wm span{position:relative;z-index:3;display:block;
        -webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;color:transparent;
        background-image:linear-gradient(180deg,var(--cream-7) 0%,var(--gold-26) 16%,var(--gold-19) 38%,
              var(--gold-12) 66%,var(--gold-4) 100%);
        -webkit-text-stroke:3.2px var(--gold-17);}
  .brand .wm:before,.brand .wm:after{content:attr(data-t);position:absolute;top:0;left:16px;}
  .brand .wm:after{-webkit-text-stroke:8px var(--cream-15);color:var(--cream-15);
        -webkit-text-fill-color:var(--cream-15);z-index:2;}
  .brand .wm:before{-webkit-text-stroke:10px var(--ink-1);color:var(--ink-1);
        -webkit-text-fill-color:var(--ink-1);z-index:1;
        text-shadow:4px 5px 0 var(--ink-1),0 14px 26px rgba(0,0,0,.46);}
  .brand .sb{position:relative;display:table;margin:18px auto 0;padding:0 80px;}
  .brand .sb:before,.brand .sb:after{content:'';position:absolute;top:50%;width:62px;height:1px;}
  .brand .sb:before{left:0;background:linear-gradient(90deg,transparent,rgba(216,190,140,.70));}
  .brand .sb:after{right:0;background:linear-gradient(90deg,rgba(216,190,140,.70),transparent);}
  .brand .sb span{font-size:12.5px;letter-spacing:.42em;text-indent:.42em;
        color:rgba(232,209,164,.80);}

  /* ── 悬浮圆角内容板 ── */
  .panel{position:absolute;left:64px;top:206px;width:952px;height:988px;
         background:linear-gradient(178deg,var(--cream-14) 0%,var(--cream-9) 62%,var(--cream-3) 100%);
         border-radius:26px;padding:84px 58px 120px;
         display:flex;flex-direction:column;justify-content:center;
         box-shadow:0 26px 60px rgba(8,6,22,.42);}
  .panel:before{content:'';position:absolute;left:12px;top:12px;right:12px;bottom:12px;
         border:1px solid rgba(196,158,96,.26);border-radius:18px;pointer-events:none;}

  /* 贴在面板上沿的小药丸标签 */
  .pill{position:absolute;z-index:6;left:58px;top:-27px;background:var(--ink-11);color:var(--gold-30);
        font-size:22px;line-height:1;font-weight:700;letter-spacing:.14em;
        padding:17px 32px;border-radius:999px;text-indent:.14em;
        box-shadow:0 10px 24px rgba(10,8,24,.34);}
  .pill:after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;
        width:18px;height:9px;background:var(--ink-11);
        clip-path:polygon(0 0,100% 0,50% 100%);}

  h1{font-size:72px;line-height:1.36;font-weight:800;color:var(--ink-10);letter-spacing:.008em;}
  /* 马克笔高亮：色块压在字上，不是改字色 */
  .mk{background:linear-gradient(180deg,rgba(240,190,116,.30) 14%,rgba(238,178,92,.62) 14%,
       rgba(238,178,92,.62) 90%,rgba(240,190,116,.30) 90%);
       padding:0 6px;margin:0 -6px;border-radius:3px;}
  .g{color:var(--gold-3);}

  .sep{height:1px;background:linear-gradient(90deg,rgba(196,158,96,.5),rgba(196,158,96,0));
       margin:38px 0 34px;}

  .body{font-size:35px;line-height:1.7;color:var(--gray-1);letter-spacing:.012em;}
  .body p{margin-bottom:18px;}
  .panel > *{flex:none;}
  .body p:last-child{margin-bottom:0;}
  .body b{color:var(--ink-10);font-weight:700;}
  .inner{display:flex;flex-direction:column;justify-content:center;flex:none;}
  .inner > *{flex:none;}

  /* 面板底部信息条：把内容撑住，避免正文短时下面空一大块 */
  .pfoot{position:absolute;left:58px;right:58px;bottom:44px;
        border-top:1px solid rgba(196,158,96,.30);padding-top:22px;
        display:flex;align-items:center;font-size:16px;letter-spacing:.2em;color:var(--gold-3);}
  .pfoot i{display:block;width:34px;height:1px;background:rgba(168,128,47,.5);margin-right:13px;}
  .pfoot span{margin-left:auto;font-size:13px;letter-spacing:.26em;color:var(--gray-5);}

  /* ── 悬浮白色签名卡 ── */
  .plate{position:absolute;left:64px;top:1232px;width:952px;height:140px;
         background:var(--neutral-5);border-radius:20px;display:flex;align-items:center;
         padding:0 26px;box-shadow:0 16px 38px rgba(8,6,22,.34);}
  .plate .av{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;
         border:2px solid var(--cream-1);}
  .plate .who{margin-left:22px;flex:1 1 auto;min-width:0;}
  .plate .nm{font-size:31px;font-weight:700;color:var(--ink-10);letter-spacing:.05em;display:flex;align-items:center;}
  .plate .tag{margin-left:14px;font-size:17px;font-weight:400;color:var(--gold-3);
         border:1px solid rgba(168,128,47,.42);border-radius:999px;padding:5px 13px;letter-spacing:.06em;}
  .plate .og{margin-top:8px;font-size:21px;color:var(--neutral-3);letter-spacing:.08em;}
  .plate .qr{width:118px;height:118px;border-radius:8px;flex:none;}
</style>
</head>

  <!--BRAND-->

    <div class="sb"><span>{{BRANDSUB}}</span></div>

  <div class="panel">
    <!--KICKER-->

      <h1>{{TITLE}}</h1>
      <div class="sep"></div>
      <div class="body">{{BODY}}</div>

    <div class="who">
      <div class="nm">{{NAME}}<!--ORG--><span class="tag">{{ORG}}</span><!--/ORG--></div>
      <div class="og">{{SUBTITLE}}</div>
    </div>
    <img class="qr" src="../assets/qr.png" alt="">
  </div>

</div>
<script>
/* 自动适配：正文写长了就逐级收字号，宁可小两号，也不能溢出卡片。
   纯同步脚本，在 Edge 截图前就已执行完毕，不影响渲染速度。 */
(function () {
  var p = document.querySelector('.panel');
  var inner = p && p.querySelector('.inner');
  if (!inner) return;
  var cs = getComputedStyle(p);
  var avail = p.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  var h1 = inner.querySelector('h1');
  var body = inner.querySelector('.body');
  var f1 = 64, f2 = 30, n = 0;
  while (inner.getBoundingClientRect().height > avail - 2 && f2 > 21 && n++ < 90) {
    f2 -= 0.5;
    if (f2 < 26) { f1 = Math.max(44, f1 - 1); }
    body.style.fontSize = f2 + 'px';
    h1.style.fontSize = f1 + 'px';
  }
})();
</script>
