<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>09-类比</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1440px;overflow:hidden;background:#1B1834;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .card{position:relative;width:1080px;height:1440px;background:#1B1834;overflow:hidden;}

  .glow{position:absolute;inset:0;
        background:
          radial-gradient(720px 520px at 50% -8%,rgba(216,190,140,.16),rgba(216,190,140,0) 66%),
          radial-gradient(620px 460px at 108% 108%,rgba(48,82,130,.26),rgba(48,82,130,0) 62%);}

  .rays{position:absolute;left:0;top:0;width:1080px;height:1440px;}
  .rays .dim{opacity:.135;}
  .rays .dim2{opacity:.07;}
  .wm{position:absolute;right:70px;top:66px;font-size:24px;font-weight:900;
      letter-spacing:.02em;transform:skewX(-8deg);
      background-image:linear-gradient(180deg,#FFF2CE 0%,#F0CE97 40%,#C99A5C 100%);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;color:transparent;
      filter:drop-shadow(0 2px 10px rgba(0,0,0,.55));}
  .kick{position:absolute;left:74px;top:74px;display:flex;align-items:center;font-size:19px;
        color:rgba(255,255,255,.44);letter-spacing:.22em;}
  .kick i{display:block;width:28px;height:1px;background:#D0B27B;margin-right:14px;}
  .kick b{font-weight:400;font-size:17px;color:rgba(255,255,255,.3);letter-spacing:.14em;margin-left:16px;}

  h1{position:absolute;left:74px;top:140px;width:900px;font-size:66px;line-height:1.3;
     font-weight:800;color:#FFFFFF;letter-spacing:.008em;}
  h1 .g{color:#D0B27B;}

  /* ── 左右两格 ── */
  .pair{position:absolute;left:74px;top:392px;width:932px;display:flex;align-items:center;}
  .box{flex:none;width:372px;height:300px;border:1px solid rgba(216,190,140,.26);
       background:rgba(255,255,255,.035);padding:34px 32px;display:flex;flex-direction:column;
       justify-content:center;}
  .box .tag{font-size:19px;letter-spacing:.3em;color:#D8BE8C;}
  .box .w{margin-top:22px;font-size:52px;line-height:1.26;font-weight:800;color:#FFFFFF;letter-spacing:.02em;}
  .box .note{margin-top:18px;font-size:30px;line-height:1.4;color:rgba(255,255,255,.62);}
  /* 用两条金色横杠画等号，比字体里的 ≈ 更整齐、更可控 */
  .eq{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .eq b{display:block;width:54px;height:2px;background:#D0B27B;}
  .eq b + b{margin-top:13px;}
  .eq span{margin-top:20px;font-size:16px;letter-spacing:.28em;color:rgba(216,190,140,.88);}

  /* ── 解释三条：固定高度内均匀分布，避免最后一条和钩子之间留大洞 ── */
  .pts{position:absolute;left:74px;top:756px;width:932px;height:316px;
       display:flex;flex-direction:column;justify-content:space-between;}
  .pt{display:flex;align-items:flex-start;}
  .pt i{flex:none;width:26px;height:1px;background:rgba(216,190,140,.6);margin:21px 22px 0 0;}
  .pt p{font-size:36px;line-height:1.5;color:rgba(255,255,255,.72);letter-spacing:.012em;}
  .pt p em{font-style:normal;color:#FFFFFF;font-weight:700;}

  /* ── 卡尾钩子 ── */
  .memo{position:absolute;left:74px;top:1104px;width:932px;padding-left:26px;
        border-left:2px solid #D8BE8C;font-size:28px;line-height:1.68;
        color:rgba(255,255,255,.5);letter-spacing:.02em;}

  /* ── 签名条 ── */
  .sig{position:absolute;left:0;bottom:0;width:1080px;height:150px;background:#15122C;
       border-top:1px solid rgba(216,190,140,.16);
       display:flex;align-items:center;padding:0 74px;}
  .sig .av{width:66px;height:66px;border-radius:50%;object-fit:cover;
           border:1px solid rgba(216,190,140,.45);}
  .sig .who{margin-left:22px;}
  .sig .nm{font-size:30px;font-weight:600;color:#FFFFFF;letter-spacing:.04em;}
  .sig .og{margin-top:6px;font-size:22px;color:rgba(255,255,255,.42);letter-spacing:.08em;}
  .sig .qr{width:112px;height:112px;margin-left:auto;padding:9px;background:#FFFFFF;
       border-radius:9px;flex:none;box-sizing:content-box;}
</style>
</head>

  </svg>

  <!--BRAND-->
  <div class="wm">{{BRAND}}</div>
  <!--/BRAND-->

  <div class="kick"><i></i>{{KICKER}}<b>{{ISSUE}}</b></div>
  <h1>{{TITLE}}</h1>

  <div class="pair">
    <div class="box">
      <div class="tag">生 活 里</div>
      <div class="w">{{H1}}</div>
      <div class="note">{{DESC_1}}</div>
    </div>
    <div class="eq"><b></b><b></b><span>本质相同</span></div>
    <div class="box">
      <div class="tag">法 律 上</div>
      <div class="w">{{H2}}</div>
      <div class="note">{{DESC_2}}</div>
    </div>
  </div>

  <div class="pts">
    <!--ITEM1-->
    <div class="pt"><i></i><p>{{POINT_1}}</p></div>
    <!--/ITEM1-->
    <!--ITEM2-->
    <div class="pt"><i></i><p>{{POINT_2}}</p></div>
    <!--/ITEM2-->
    <!--ITEM3-->
    <div class="pt"><i></i><p>{{POINT_3}}</p></div>
    <!--/ITEM3-->
  </div>

  <!--MEMO-->
  <div class="memo">{{MEMO}}</div>
  <!--/MEMO-->

  <div class="sig">
    <img class="av" src="../assets/avatar.png" alt="">
    <div class="who">
      <div class="nm">{{NAME}}</div>
      <div class="og">{{ORG}}</div>
    </div>
    <img class="qr" src="../assets/qr.png" alt="">
  </div>

</div>
</body>
</html>
