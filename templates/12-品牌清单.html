<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>12-品牌清单</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1440px;overflow:hidden;background:#1B1834;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .card{position:relative;width:1080px;height:1440px;overflow:hidden;
        background:linear-gradient(158deg,#241F44 0%,#1A1731 44%,#221C3E 72%,#1D1836 100%);}

  /* ── 底纹：放射光线（PDF 里最有辨识度的一层） ── */
  .rays{position:absolute;left:0;top:0;width:1080px;height:1440px;}
  .rays .dim{opacity:.155;}
  .rays .dim2{opacity:.085;}
  .halo{position:absolute;left:-120px;top:-260px;width:1320px;height:900px;
        background:radial-gradient(560px 380px at 50% 42%,rgba(216,190,140,.13),rgba(216,190,140,0) 66%);}
  .ring{position:absolute;border-radius:50%;border:1px solid rgba(216,190,140,.10);}
  .ring.a{width:1180px;height:1180px;left:-50px;top:120px;}
  .ring.b{width:880px;height:880px;left:100px;top:270px;border-color:rgba(216,190,140,.07);}

  /* ── 品牌标识：居中大字 + 小字 + 菱形 ── */
  .env{position:absolute;left:0;top:0;width:1080px;height:202px;
       background:linear-gradient(180deg,#241D4E 0%,#1A1436 40%,#100C24 100%);
       clip-path:polygon(0 0,1080px 0,1080px 202px,540px 129px,0 202px);}
  .envline{position:absolute;left:0;top:0;width:1080px;height:202px;pointer-events:none;}
  .panel:after{content:'';position:absolute;left:0;right:0;top:-64px;height:65px;
       background:linear-gradient(180deg,rgba(20,14,38,.30) 0%,rgba(20,14,38,.13) 32%,rgba(20,14,38,0) 74%),#FEF9F0;
       clip-path:polygon(0 64px,476px 0,952px 64px,952px 100%,0 100%);}
  .brand{position:absolute;left:0;top:12px;width:1080px;text-align:center;}
  .brand .wm{position:relative;display:inline-block;font-weight:900;font-size:64px;line-height:1;
        letter-spacing:.035em;transform:skewX(-11deg) scaleY(1.03);padding:0 16px 12px;}
  .brand .wm span{position:relative;z-index:3;display:block;
        -webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;color:transparent;
        background-image:linear-gradient(180deg,#FFF6DA 0%,#F4DAA6 16%,#E6C085 38%,
              #D2A05C 66%,#B57F38 100%);
        -webkit-text-stroke:3.2px #E2BA7E;}
  .brand .wm:before,.brand .wm:after{content:attr(data-t);position:absolute;top:0;left:16px;}
  .brand .wm:after{-webkit-text-stroke:8px #FFFBEF;color:#FFFBEF;
        -webkit-text-fill-color:#FFFBEF;z-index:2;}
  .brand .wm:before{-webkit-text-stroke:10px #0C0918;color:#0C0918;
        -webkit-text-fill-color:#0C0918;z-index:1;
        text-shadow:4px 5px 0 #0C0918,0 14px 26px rgba(0,0,0,.46);}
  .brand .sb{position:relative;display:table;margin:18px auto 0;padding:0 80px;}
  .brand .sb:before,.brand .sb:after{content:'';position:absolute;top:50%;width:62px;height:1px;}
  .brand .sb:before{left:0;background:linear-gradient(90deg,transparent,rgba(216,190,140,.70));}
  .brand .sb:after{right:0;background:linear-gradient(90deg,rgba(216,190,140,.70),transparent);}
  .brand .sb span{font-size:12.5px;letter-spacing:.42em;text-indent:.42em;
        color:rgba(232,209,164,.80);}

  /* ── 悬浮圆角内容板 ── */
  .panel{position:absolute;left:64px;top:190px;width:952px;height:1024px;
         background:linear-gradient(178deg,#FEF9F0 0%,#FBF1DF 62%,#F8EBD4 100%);
         border-radius:26px;padding:70px 58px 0;
         box-shadow:0 26px 60px rgba(8,6,22,.42);}
  .panel:before{content:'';position:absolute;left:12px;top:12px;right:12px;bottom:12px;
         border:1px solid rgba(196,158,96,.26);border-radius:18px;pointer-events:none;}

  /* 贴在面板上沿的小药丸标签 */
  .pill{position:absolute;z-index:6;left:58px;top:-27px;background:#241F44;color:#F2E1BE;
        font-size:22px;line-height:1;font-weight:700;letter-spacing:.14em;
        padding:17px 32px;border-radius:999px;text-indent:.14em;
        box-shadow:0 10px 24px rgba(10,8,24,.34);}
  .pill:after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;
        width:18px;height:9px;background:#241F44;
        clip-path:polygon(0 0,100% 0,50% 100%);}

  h1{font-size:56px;line-height:1.44;font-weight:800;color:#241E44;letter-spacing:.008em;}
  /* 马克笔高亮：色块压在字上，不是改字色 */
  .mk{background:linear-gradient(180deg,rgba(240,190,116,.30) 14%,rgba(238,178,92,.62) 14%,
       rgba(238,178,92,.62) 90%,rgba(240,190,116,.30) 90%);
       padding:0 6px;margin:0 -6px;border-radius:3px;}
  .g{color:#A8802F;}

  .sep{height:1px;background:linear-gradient(90deg,rgba(196,158,96,.5),rgba(196,158,96,0));
       margin:38px 0 34px;}

  .body{font-size:28px;line-height:1.8;color:#57506C;letter-spacing:.012em;}
  .body p{margin-bottom:16px;}
  .body p:last-child{margin-bottom:0;}
  .body b{color:#241E44;font-weight:700;}

  /* ── 列表：行高自动均分，条目少也不留白洞 ── */
  .list{position:absolute;left:58px;right:58px;top:238px;bottom:104px;
        display:flex;flex-direction:column;justify-content:center;}
  .it{display:flex;align-items:center;flex:1 1 0;min-height:110px;max-height:218px;
      border-bottom:1px solid rgba(196,158,96,.28);}
  .it:last-child{border-bottom:none;}
  .it .no{flex:none;width:112px;font-family:Georgia,serif;font-size:62px;line-height:1;
      color:#D3B77F;letter-spacing:.02em;}
  .it .tx{flex:1 1 auto;min-width:0;padding-right:12px;}
  .it h3{font-size:43px;line-height:1.3;font-weight:800;color:#241E44;letter-spacing:.012em;}
  .it h3 em{font-style:normal;color:#A8802F;}
  .it p{margin-top:12px;font-size:33px;line-height:1.44;color:#5C5572;letter-spacing:.012em;}

  /* ── 条目越少，字越大：3 条 / 4 条各一档，5 条用上面的默认值 ── */
  .list:not(:has(.it:nth-child(4))) .it{max-height:250px;}
  .list:not(:has(.it:nth-child(4))) .it .no{width:120px;font-size:68px;}
  .list:not(:has(.it:nth-child(4))) .it h3{font-size:50px;line-height:1.28;}
  .list:not(:has(.it:nth-child(4))) .it p{margin-top:15px;font-size:38px;line-height:1.4;}

  .list:has(.it:nth-child(4)):not(:has(.it:nth-child(5))) .it{max-height:216px;}
  .list:has(.it:nth-child(4)):not(:has(.it:nth-child(5))) .it .no{width:114px;font-size:64px;}
  .list:has(.it:nth-child(4)):not(:has(.it:nth-child(5))) .it h3{font-size:44px;line-height:1.3;}
  .list:has(.it:nth-child(4)):not(:has(.it:nth-child(5))) .it p{margin-top:13px;font-size:33px;line-height:1.42;}
  /* 面板底部信息条：把内容撑住，避免正文短时下面空一大块 */
  .pfoot{position:absolute;left:58px;right:58px;bottom:44px;
        border-top:1px solid rgba(196,158,96,.30);padding-top:22px;
        display:flex;align-items:center;font-size:16px;letter-spacing:.2em;color:#A8802F;}
  .pfoot i{display:block;width:34px;height:1px;background:rgba(168,128,47,.5);margin-right:13px;}
  .pfoot span{margin-left:auto;font-size:13px;letter-spacing:.26em;color:#A9A2B4;}

  /* ── 悬浮白色签名卡 ── */
  .plate{position:absolute;left:64px;top:1240px;width:952px;height:140px;
         background:#FFFFFF;border-radius:20px;display:flex;align-items:center;
         padding:0 26px;box-shadow:0 16px 38px rgba(8,6,22,.34);}
  .plate .av{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;
         border:2px solid #EFE2C8;}
  .plate .who{margin-left:22px;flex:1 1 auto;min-width:0;}
  .plate .nm{font-size:31px;font-weight:700;color:#241E44;letter-spacing:.05em;display:flex;align-items:center;}
  .plate .tag{margin-left:14px;font-size:17px;font-weight:400;color:#A8802F;
         border:1px solid rgba(168,128,47,.42);border-radius:999px;padding:5px 13px;letter-spacing:.06em;}
  .plate .og{margin-top:8px;font-size:21px;color:#8A8496;letter-spacing:.08em;}
  .plate .qr{width:118px;height:118px;border-radius:8px;flex:none;}
</style>
</head>
