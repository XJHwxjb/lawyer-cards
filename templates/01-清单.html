<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>01-清单</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1440px;overflow:hidden;background:#FFFFFF;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;}
  .card{position:relative;width:1080px;height:1440px;background:#FFFFFF;overflow:hidden;}

  /* ── 上半深色斜切块 ── */
  .hero{position:absolute;left:0;top:0;width:1080px;height:520px;background:#241E44;
        clip-path:polygon(0 0,100% 0,100% 428px,0 520px);overflow:hidden;}
  .tex{position:absolute;inset:0;
       background-image:
         repeating-linear-gradient(0deg,rgba(255,255,255,.042) 0 1px,transparent 1px 74px),
         repeating-linear-gradient(90deg,rgba(255,255,255,.042) 0 1px,transparent 1px 74px);}
  .ring{position:absolute;border-radius:50%;border:1px solid rgba(216,190,140,.26);}
  .ring.a{width:560px;height:560px;left:710px;top:-250px;}
  .ring.b{width:820px;height:820px;left:580px;top:-380px;}
  .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#D0B27B;}
  .dot.d1{left:788px;top:224px;}
  .dot.d2{left:846px;top:411px;}

  .kick{position:absolute;left:74px;top:100px;display:flex;align-items:center;}
  .kick i{display:block;width:34px;height:1px;background:#D0B27B;margin-right:16px;}
  .kick span{font-size:21px;color:rgba(255,255,255,.62);letter-spacing:.24em;}
  .kick b{font-size:18px;font-weight:400;color:#D0B27B;letter-spacing:.1em;
          border:1px solid rgba(216,190,140,.42);padding:3px 11px;margin-left:18px;}

  .ttl{position:absolute;left:74px;top:194px;width:840px;
       font-size:72px;line-height:1.26;font-weight:800;color:#FFFFFF;letter-spacing:.004em;}
  .ttl .g{color:#D0B27B;}

  /* 破界角标 */
  .badge{position:absolute;left:74px;top:486px;background:#D0B27B;color:#241E44;
         font-size:22px;font-weight:700;letter-spacing:.12em;padding:13px 26px;}

  /* ── 列表区：自动均分填满，不留底白 ── */
  .list{position:absolute;left:0;top:556px;bottom:150px;width:1080px;justify-content:center;
        padding:0 74px;display:flex;flex-direction:column;}
  .it{flex:0 0 auto;min-height:147px;display:flex;align-items:center;
      border-bottom:1px solid #EBEEF3;}
  .it:last-child{border-bottom:none;}
  .n{flex:none;width:100px;font-family:Georgia,serif;font-size:58px;line-height:1;
     color:#C9D6E4;letter-spacing:.02em;}
  .i{flex:none;width:24px;height:24px;margin-right:20px;}
  .i svg{display:block;width:24px;height:24px;}
  .t{flex:1 1 auto;min-width:0;}
  .t h3{font-size:33px;line-height:1.3;font-weight:700;color:#241E44;letter-spacing:.01em;}
  .t p{margin-top:9px;font-size:26px;line-height:1.42;color:#6B7789;letter-spacing:.01em;}

  /* ── 签名条 ── */
  .sig{position:absolute;left:0;bottom:0;width:1080px;height:150px;background:#241E44;
       display:flex;align-items:center;padding:0 74px;}
  .sig .av{width:66px;height:66px;border-radius:50%;object-fit:cover;
           border:1px solid rgba(216,190,140,.5);}
  .sig .who{margin-left:22px;}
  .sig .nm{font-size:30px;font-weight:600;color:#FFFFFF;letter-spacing:.04em;}
  .sig .og{margin-top:6px;font-size:22px;color:rgba(255,255,255,.5);letter-spacing:.08em;}
  .sig .qr{width:112px;height:112px;margin-left:auto;padding:9px;background:#FFFFFF;
       border-radius:9px;flex:none;box-sizing:content-box;}
</style>
</head>
<body>
<div class="card">

  <div class="hero">
    <div class="tex"></div>
    <div class="ring a"></div>
    <div class="ring b"></div>
    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="kick"><i></i><span>{{KICKER}}</span><b>{{ISSUE}}</b></div>
    <div class="ttl">{{TITLE}}</div>
  </div>

  <div class="badge">{{BADGE}}</div>

  <div class="list">
    <!--ITEM1-->
    <div class="it">
      <div class="n">01</div>
      <div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#D0B27B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></div>
      <div class="t"><h3>{{POINT_1}}</h3><p>{{DESC_1}}</p></div>
    </div>
    <!--/ITEM1-->
    <!--ITEM2-->
    <div class="it">
      <div class="n">02</div>
      <div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#D0B27B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v15"/><path d="M7 20h10"/><path d="M4 8h16"/><path d="M4 8l-2.5 5.5a3 3 0 0 0 5 0z"/><path d="M20 8l-2.5 5.5a3 3 0 0 0 5 0z"/></svg></div>
      <div class="t"><h3>{{POINT_2}}</h3><p>{{DESC_2}}</p></div>
    </div>
    <!--/ITEM2-->
    <!--ITEM3-->
    <div class="it">
      <div class="n">03</div>
      <div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#D0B27B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></svg></div>
      <div class="t"><h3>{{POINT_3}}</h3><p>{{DESC_3}}</p></div>
    </div>
    <!--/ITEM3-->
    <!--ITEM4-->
    <div class="it">
      <div class="n">04</div>
      <div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#D0B27B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M9 8l3 4 3-4"/><path d="M12 12v5"/><path d="M9.5 13.2h5M9.5 15.2h5"/></svg></div>
      <div class="t"><h3>{{POINT_4}}</h3><p>{{DESC_4}}</p></div>
    </div>
    <!--/ITEM4-->
    <!--ITEM5-->
    <div class="it">
      <div class="n">05</div>
      <div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#D0B27B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v2"/></svg></div>
      <div class="t"><h3>{{POINT_5}}</h3><p>{{DESC_5}}</p></div>
    </div>
    <!--/ITEM5-->
  </div>

  <div class="sig">
    <img class="av" src="../assets/avatar.png" alt="">
    <div class="who">
      <div class="nm">{{NAME}}</div>
      <div class="og">{{ORG}}</div>
    </div>
    <img class="qr" src="../assets/qr.png" alt="">
  </div>

</div>
</body>
</html>
